name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/custom/oneuiqs app/src/main/res/values app/src/main/assets

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://api.xposed.info/") }
              }
          }
          rootProject.name = "OneUIHomeQuickPanel"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.custom.oneuiqs"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.custom.oneuiqs"
                  minSdk = 34
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="OneUI Home QuickPanel"
                  android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="One UI Home asagi kaydirma jestini Quick Panel yapar" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/arrays.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.sec.android.app.launcher</item>
              </string-array>
          </resources>
          EOF

          echo "com.custom.oneuiqs.MainHook" > app/src/main/assets/xposed_init

          cat << 'EOF' > app/src/main/java/com/custom/oneuiqs/MainHook.java
          package com.custom.oneuiqs;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              private static final String TARGET_PKG = "com.sec.android.app.launcher";

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if (!TARGET_PKG.equals(lpparam.packageName)) {
                      return;
                  }

                  XposedBridge.log("[OneUIQS] One UI Home yuklendi, kancalar kuruluyor...");

                  Class<?> statusBarManager = XposedHelpers.findClassIfExists(
                          "android.app.StatusBarManager", lpparam.classLoader);
                  if (statusBarManager != null) {
                      XposedBridge.hookAllMethods(statusBarManager, "expandNotificationsPanel", new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              try {
                                  XposedHelpers.callMethod(param.thisObject, "expandSettingsPanel");
                                  param.setResult(null);
                              } catch (Throwable t) {
                                  XposedBridge.log("[OneUIQS] StatusBarManager hatasi: " + t);
                              }
                          }
                      });
                  }

                  Class<?> semStatusBarManager = XposedHelpers.findClassIfExists(
                          "android.app.SemStatusBarManager", lpparam.classLoader);
                  if (semStatusBarManager != null) {
                      XposedBridge.hookAllMethods(semStatusBarManager, "expandNotificationsPanel", new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              try {
                                  XposedHelpers.callMethod(param.thisObject, "expandSettingsPanel");
                                  param.setResult(null);
                              } catch (Throwable t) {
                                  XposedBridge.log("[OneUIQS] SemStatusBarManager hatasi: " + t);
                              }
                          }
                      });
                  }

                  Class<?> statusBarProxy = XposedHelpers.findClassIfExists(
                          "com.android.internal.statusbar.IStatusBarService$Stub$Proxy", lpparam.classLoader);
                  if (statusBarProxy != null) {
                      XposedBridge.hookAllMethods(statusBarProxy, "expandNotificationsPanel", new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              try {
                                  XposedHelpers.callMethod(
                                          param.thisObject,
                                          "expandSettingsPanel",
                                          new Class<?>[]{String.class},
                                          (Object) null
                                  );
                                  param.setResult(null);
                              } catch (Throwable t) {
                                  XposedBridge.log("[OneUIQS] IStatusBarService hatasi: " + t);
                              }
                          }
                      });
                  }
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-Home-QuickPanel
          path: app/build/outputs/apk/debug/app-debug.apk
          
